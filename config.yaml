# Hyperparameters and Configuration for Explainable Rehabilitation ST-GAT

paths:
  data_dir: "SkeletonData/SkeletonData/RawData"
  checkpoint_dir: "checkpoints"
  log_dir: "logs"
  baseline_dir: "baselines"
  db_path: "rehab_sessions.db"
  model_weights: "checkpoints/st_gat_loso.pt"
  best_model_weights: "checkpoints/best_model.pt"

training:
  seed: 42
  batch_size: 64
  epochs: 80
  lr: 0.0002
  weight_decay: 0.0001
  num_workers: 0  # Set to 0 for Windows compatibility
  patience: 8
  early_stopping_delta: 0.001
  sequence_length: 64
  hidden_dim: 64
  heads: 4
  dropout: 0.2
  loss_type: "weighted_ce"  # Options: "weighted_ce", "focal"
  focal_gamma: 2.0
  device: "cuda"  # RTX 4060 Laptop GPU, 8GB VRAM — batch 64 uses ~0.83 GB

model:
  num_joints: 25
  input_dim: 3
  num_classes: 2
  heads: 4
  dropout: 0.2

uncertainty:
  confidence_threshold: 0.70

biomechanical:
  weights:
    w_rom: 0.3
    w_sym: 0.2
    w_vel: 0.2
    w_acc: 0.1
    w_attention: 0.2
  quality_score:
    w_rom: 0.4
    w_sym: 0.3
    w_temporal: 0.1
    w_bio: 0.2

calibration:
  baseline_drift_enabled: true
  baseline_drift_alpha: 0.95

